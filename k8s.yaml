apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: meow-deploy
  name: meow-deploy
spec:
  replicas: 4
  selector:
    matchLabels:
      app: meow-deploy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: meow-deploy
    spec:
      containers:
      - image: fluffythepenguin/meow-app:v5
        name: meow-app
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
        envFrom:
          - configMapRef:
              name: app-config
          - secretRef:
              name: app-secret
        volumeMounts:
          - name: log-storage
            mountPath: /app/logs
      volumes:
        - name: log-storage
          persistentVolumeClaim:
            claimName: meow-pvc

status: {}

---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: meow-deploy
  name: meow-deploy
spec:
  ports:
  - port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: meow-deploy
  type: LoadBalancer
status:
  loadBalancer: {}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_COLOR: "blue"
  APP_MODE: "Production"

---

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
stringData:
  DB_PASSWORD: "meow123"


---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meow-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi


---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meow-ingress
spec:
  rules:
    - host: meow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meow-deploy
                port:
                  number: 80

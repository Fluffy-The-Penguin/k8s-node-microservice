name: Meow CI Pipeline

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm install
      - name: Verify JS Syntax
        run: node --check server.js
      - name: Test Docker build
        run: docker build -t meow-app:test .

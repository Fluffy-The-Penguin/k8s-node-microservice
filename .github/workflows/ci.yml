name: Meow CI Pipeline

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Dependencies
        run: npm install
      - name: Verify JS Syntax
        run: node --check server.js
      - name: Build Docker image
        run: docker build -t fluffythepenguin:meow-app:v${{ github.run_number }}
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fluffythepenguin:meow-app:v${{ github.run_number }}
          severity: CRITICAL
      - name: Login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u fluffythepenguin --password-stdin
      - name: Push to docker
        run: docker push fluffythepenguin/meow-app:v${{ github.run_number }}
